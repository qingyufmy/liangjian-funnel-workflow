schema_version: liangjian-runtime/1.0.0
mode: SIMULATION_WORKFLOW
timezone: Asia/Shanghai
research_slots:
  premarket: "08:30"
  morning: "09:26"
  close: "15:10"
review_slots:
  a5_midday: "11:35"
  a5_post_close: "16:00"
  input_cutoffs: ["11:30", "15:00"]
  authority: READ_ONLY_PROPOSAL
feature_maintenance:
  schedule: "03:30"
  saturday_mode: "FULL"
  weekday_mode: "INCREMENTAL"
  sunday: "NOOP"
monitor:
  model: deepseek-v4-flash-0731
  cadence_seconds: 60
  max_seconds: 50
  sessions:
    - ["09:31", "11:30"]
    - ["13:01", "15:00"]
data_sources:
  hithink:
    responsibilities:
      - ticker_catalog
      - realtime_snapshot
      - daily_bars
      - financial_statements
      - financial_indicators
      - ths_index_catalog
      - ths_industry_membership
      - auction
      - limit_pools
      - limit_ladder
      - dragon_tiger
      - hot_stock_attention
  mootdx:
    responsibilities: [minute_1m, minute_5m]
    raw_prices_only: true
    page_size: 800
    max_pages: 20
    history_5m_required_bars: 12240
    exchanges: [SH, SZ]
    unsupported_exchanges: [BJ]
  cninfo:
    responsibilities: [candidate_announcement_metadata, disclosure_events, risk_events, bounded_pdf_evidence]
    public_web_contract: true
    pdf_download_mode: on_demand
    pdf_max_documents_per_symbol: 3
    pdf_full_text_to_model: false
    pdf_ocr_enabled: false
  gov_policy_library:
    responsibilities: [official_state_council_policy, official_department_policy]
    public_web_contract: true
    excluded_categories: [policy_interpretation, state_council_gazette_duplicate]
    direct_stock_mapping: false
  open_news:
    responsibilities: [market_flash, candidate_stock_news, curated_industry_rss]
    providers: [cls, eastmoney_7x24, eastmoney_search, curated_rss]
    evidence_tier: T3
    untrusted_text: true
    failure_action: DEGRADE_TO_OBSERVATION
    rss_catalog: config/news_sources.json
  a1_research_sources:
    registry: config/a1_research_sources.yaml
    responsibilities: [source_authorization, source_role_coverage, reviewed_evidence_binding]
    homepage_is_evidence: false
    paid_content_auto_scrape: false
    direct_stock_selection_allowed: false
  a2_market:
    responsibilities: [capital_flow, rotation_theme_strength, tier_structure, leader_structure, chain_resonance]
    structure_primary_source: hithink_ths
    rotation_theme_registry: config/rotation_themes_v1.yaml
    rotation_membership_source: eastmoney_versioned_local_snapshot
    rotation_membership_refresh_days: 7
    rotation_membership_warn_age_days: 7
    rotation_membership_max_age_days: 14
    rotation_strength_source: liangjian_transparent_six_factor
    rotation_primary_count: 5
    capital_flow_primary_source: tencent_qq_finance_today_fund_flow
    capital_flow_fallback_source: eastmoney_delayed_public_data_endpoint
    price_volume_validation_source: mootdx_tdx
    capital_flow_unsupported_sources: [hithink_ths_official_api, mootdx_tdx]
    provider_method: VENDOR_DERIVED
    turnover_is_capital_flow: false
    point_in_time_cache_required: true
    minimum_coverage: 0.90
    capital_flow_workers: 16
models:
  research:
    - deepseek-v4-pro-0813
  monitor: deepseek-v4-flash-0731
permissions:
  external_orders: false
  gm_fallback: false
  live_trading: false
  fast_track: false
