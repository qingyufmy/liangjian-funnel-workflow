        concept_names: [机器人概念, 人形机器人, 工业母机, 高端装备, 减速器, 机器视觉, 3D打印, 工业互联网, 新型工业化, 传感器]
      - canonical_id: POWER_EQUIPMENT_NEW_ENERGY
