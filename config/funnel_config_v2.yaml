        industry_names: [种植业与林业, 种子生产, 粮食种植, 农业综合, 养殖业, 生猪养殖, 农产品加工, 动物保健, 畜禽饲料, 水产养殖]
        concept_names: [农业种植, 粮食概念, 玉米, 大豆, 转基因, 猪肉, 养鸡, 生态农业, 乡村振兴, 农机, 农村电商, 供销社, 数字乡村]
