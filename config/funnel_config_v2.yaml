        industry_names: [软件开发, IT服务, 计算机设备, 通信服务, 数字媒体, 文化传媒, 广告营销]
        concept_names: [人工智能, AI应用, AIGC概念, ChatGPT概念, 多模态AI, AI智能体, DeepSeek概念, 数据要素, 数据安全, 数字经济, 数字货币, 智慧政务, 信创, 华为鲲鹏, MLOps概念]
