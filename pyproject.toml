[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liangjian-funnel-workflow"
version = "0.1.0"
description = "Independent, fail-closed A-share funnel workflow"
requires-python = ">=3.11"
dependencies = [
  "akshare==1.18.94",
  "exchange-calendars>=4.13.2,<5",
  "httpx>=0.25,<1",
  "mootdx>=0.11.7,<0.12",
  "pypdf>=5,<7",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
liangjian-funnel = "liangjian_funnel.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.data-files]
"share/liangjian-funnel" = [
  "FINAL_IMPLEMENTATION_PLAN.md",
  "AUDIT_REMEDIATION_2026-08-25.md",
  "DEPLOYMENT.md",
  "IMPLEMENTATION_STATUS.md",
  "DETERMINISTIC_RESEARCH_PIPELINE_V2_PLAN.md",
  "README.md",
  "THIRD_PARTY_NOTICES.md",
]
"share/liangjian-funnel/config" = ["config/*.yaml", "config/*.json"]
"share/liangjian-funnel/prompts" = ["prompts/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
