[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liangjian-funnel-workflow"
version = "0.1.0"
description = "Independent, fail-closed A-share funnel workflow"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.25,<1",
  "mootdx>=0.11.7,<0.12",
  "pypdf>=5,<7",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
liangjian-funnel = "liangjian_funnel.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
